name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble app bundle
        run: ./build.sh --universal
